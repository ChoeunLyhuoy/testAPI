name: pos_system_mobile
description: "KOK POS - Clean OOP Flutter POS System"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  http: ^1.2.2
  image_picker: ^1.1.2
  provider: ^6.1.1
  mobile_scanner: ^7.2.0
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/banners/
    - assets/images/